<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripSage — Multi-Agent Travel Planner</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    margin: 0;
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 1080px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 {
    font-size: 2.2rem;
    margin-bottom: 4px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: #94a3b8; margin: 0; }

  .card {
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    backdrop-filter: blur(6px);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 0.95rem;
  }
  input:focus { outline: none; border-color: #38bdf8; }

  button#planBtn {
    margin-top: 20px; width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, #38bdf8, #6366f1); color: white;
    font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
  }
  button#planBtn:hover { opacity: 0.9; }
  button#planBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  #status { text-align: center; margin: 16px 0; color: #94a3b8; font-size: 0.9rem; }
  .spinner {
    display: inline-block; width: 16px; height: 16px; border: 2px solid #334155;
    border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #results { display: none; }
  .section-title {
    font-size: 1.1rem; font-weight: 600; color: #38bdf8; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .badge {
    display: inline-block; padding: 6px 12px; border-radius: 999px;
    font-size: 0.85rem; font-weight: 600;
  }
  .badge.ok { background: #14532d; color: #86efac; }
  .badge.over { background: #7f1d1d; color: #fca5a5; }

  .budget-bars { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
  .budget-row { display: flex; align-items: center; gap: 12px; }
  .budget-label { width: 90px; font-size: 0.85rem; color: #cbd5e1; flex-shrink: 0; }
  .budget-track {
    flex: 1; background: #0f172a; border-radius: 6px; height: 22px; overflow: hidden;
    border: 1px solid #334155;
  }
  .budget-fill {
    height: 100%; background: linear-gradient(90deg, #38bdf8, #6366f1);
    display: flex; align-items: center; justify-content: flex-end; padding-right: 8px;
    font-size: 0.72rem; color: white; font-weight: 600; white-space: nowrap;
  }
  .budget-amount { width: 90px; text-align: right; font-size: 0.85rem; color: #94a3b8; flex-shrink: 0; }

  .alt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .alt-card { background: #0f172a; border: 1px dashed #475569; border-radius: 10px; padding: 14px; }
  .alt-card h4 { margin: 0 0 6px 0; color: #a78bfa; font-size: 0.9rem; }
  .alt-card p { margin: 0; font-size: 0.82rem; color: #94a3b8; line-height: 1.5; }
  .alt-card .alt-cost { font-size: 0.85rem; color: #cbd5e1; font-weight: 600; margin-top: 6px; }

  .scroll-row {
    display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px;
    scroll-snap-type: x mandatory;
  }
  .scroll-row::-webkit-scrollbar { height: 8px; }
  .scroll-row::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

  .opt-card {
    flex: 0 0 280px; scroll-snap-align: start;
    background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .opt-card.best { border-color: #38bdf8; box-shadow: 0 0 0 1px #38bdf8; }
  .opt-rank { font-size: 0.7rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
  .opt-title { font-size: 1.05rem; font-weight: 600; color: #f1f5f9; margin: 0; }
  .opt-sub { font-size: 0.82rem; color: #94a3b8; margin: 0; }
  .opt-price { font-size: 1.2rem; font-weight: 700; color: #38bdf8; margin-top: 4px; }
  .opt-meta { font-size: 0.78rem; color: #64748b; }
  .opt-book {
    margin-top: auto; padding-top: 10px;
    display: block; text-align: center; padding: 10px;
    background: #1e293b; border: 1px solid #475569; border-radius: 8px;
    color: #e2e8f0; text-decoration: none; font-size: 0.85rem; font-weight: 600;
    transition: background 0.15s;
  }
  .opt-book:hover { background: #334155; }

  .day-block { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid #334155; }
  .day-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .day-title { font-size: 0.95rem; font-weight: 600; color: #a78bfa; margin-bottom: 10px; }
  .stop-row { display: flex; gap: 12px; margin-bottom: 10px; }
  .stop-time { width: 80px; flex-shrink: 0; font-size: 0.78rem; color: #38bdf8; font-weight: 600; }
  .stop-info { flex: 1; }
  .stop-place { font-size: 0.92rem; color: #f1f5f9; font-weight: 600; margin: 0; }
  .stop-desc { font-size: 0.82rem; color: #94a3b8; margin: 2px 0 0 0; line-height: 1.5; }
  .stop-transport { font-size: 0.75rem; color: #64748b; margin-top: 2px; }

  .error-box {
    background: #7f1d1d; color: #fecaca; padding: 14px 18px; border-radius: 10px;
    display: none; font-size: 0.9rem;
  }
  .raw-toggle { margin-top: 16px; font-size: 0.8rem; color: #64748b; cursor: pointer; text-decoration: underline; }
  pre {
    background: #0f172a; padding: 14px; border-radius: 8px; overflow-x: auto;
    font-size: 0.8rem; color: #94a3b8; display: none; white-space: pre-wrap; word-break: break-word;
  }

  @media (max-width: 640px) {
    .form-grid, .alt-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>✈️ TripSage</h1>
    <p>Multi-Agent Autonomous Travel Planning Assistant</p>
  </header>

  <div class="card">
    <div class="form-grid">
      <div><label>Origin</label><input type="text" id="origin" value="Pune"></div>
      <div><label>Destination</label><input type="text" id="destination" value="Goa"></div>
      <div><label>Budget (INR)</label><input type="number" id="budget" value="15000"></div>
      <div><label>Travelers</label><input type="number" id="travelers" value="2"></div>
      <div><label>Start Date</label><input type="date" id="start_date" value="2026-10-10"></div>
      <div><label>End Date</label><input type="date" id="end_date" value="2026-10-13"></div>
      <div class="full"><label>Interests</label><input type="text" id="interests" value="beaches, food, nightlife"></div>
    </div>
    <button id="planBtn" onclick="planTrip()">Plan My Trip</button>
  </div>

  <div id="status"></div>
  <div class="error-box" id="errorBox"></div>

  <div id="results">
    <div class="card">
      <div class="section-title">📋 Trip Summary</div>
      <p id="tripSummary" style="color:#cbd5e1; line-height:1.6;"></p>
    </div>

    <div class="card">
      <div class="section-title">💰 Budget Breakdown</div>
      <div id="budgetBadgeWrap"></div>
      <div class="budget-bars" id="budgetBars"></div>
      <p style="color:#64748b; font-size:0.82rem; margin-top:10px;" id="budgetReasoning"></p>
      <div class="alt-grid" id="altGrid"></div>
    </div>

    <div class="card">
      <div class="section-title">🏨 Stay Options <span style="color:#64748b; font-weight:400; font-size:0.8rem;">— scroll to compare</span></div>
      <div class="scroll-row" id="stayRow"></div>
    </div>

    <div class="card">
      <div class="section-title">🚌 Travel Options <span style="color:#64748b; font-weight:400; font-size:0.8rem;">— scroll to compare</span></div>
      <div class="scroll-row" id="travelRow"></div>
    </div>

    <div class="card">
      <div class="section-title">🗓️ Day-by-Day Itinerary</div>
      <div id="itineraryDays"></div>
    </div>

    <div class="card">
      <p style="color:#64748b; font-size:0.85rem; margin:0;" id="bookingNote"></p>
    </div>

    <div class="raw-toggle" onclick="toggleRaw()">Show raw agent output</div>
    <pre id="rawOutput"></pre>
  </div>
</div>

<script>
const WEBHOOK_URL = "http://localhost:5678/webhook/tripsage-input";

async function planTrip() {
  const btn = document.getElementById('planBtn');
  const status = document.getElementById('status');
  const errorBox = document.getElementById('errorBox');
  const results = document.getElementById('results');

  const payload = {
    origin: document.getElementById('origin').value,
    destination: document.getElementById('destination').value,
    budget: Number(document.getElementById('budget').value),
    travelers: Number(document.getElementById('travelers').value),
    start_date: document.getElementById('start_date').value,
    end_date: document.getElementById('end_date').value,
    interests: document.getElementById('interests').value
  };

  btn.disabled = true;
  results.style.display = 'none';
  errorBox.style.display = 'none';
  status.innerHTML = '<span class="spinner"></span> Agents are planning your trip... this can take 15-30 seconds';

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Server responded with status ' + res.status);

    const rawText = await res.text();
    let data;
    try {
      data = JSON.parse(rawText);
    } catch (e) {
      const outer = JSON.parse(rawText);
      data = typeof outer.text === 'string' ? JSON.parse(outer.text) : outer;
    }

    renderResults(data, rawText, payload);
    status.innerHTML = '';
  } catch (err) {
    status.innerHTML = '';
    errorBox.style.display = 'block';
    errorBox.textContent = 'Could not reach TripSage agents. Make sure n8n is running and the workflow is active. (' + err.message + ')';
  } finally {
    btn.disabled = false;
  }
}

function fmt(n) {
  if (n === undefined || n === null || isNaN(n)) return '—';
  return '₹' + Number(n).toLocaleString('en-IN');
}

function hotelBookingUrl(name, destination, platform) {
  const q = encodeURIComponent(`book ${name} ${platform || ''} ${destination} hotel`);
  return `https://www.google.com/search?q=${q}`;
}

function flightBookingUrl(origin, destination, date, provider) {
  const q = encodeURIComponent(`Flights from ${origin} to ${destination} on ${date}`);
  return `https://www.google.com/travel/flights?q=${q}`;
}

function genericTravelUrl(mode, provider, origin, destination, platform) {
  if (/flight/i.test(mode)) return null;
  const q = encodeURIComponent(`${provider || mode} tickets ${origin} to ${destination} book ${platform || ''}`);
  return `https://www.google.com/search?q=${q}`;
}

function renderResults(data, rawText, payload) {
  document.getElementById('tripSummary').textContent = data.trip_summary || 'No summary returned.';

  const bb = data.budget_breakdown || {};
  const fits = bb.fits_budget;
  document.getElementById('budgetBadgeWrap').innerHTML =
    '<span class="badge ' + (fits ? 'ok' : 'over') + '">' +
    (fits ? '✅ Within budget' : '⚠️ Over budget by ' + fmt(bb.difference)) +
    ' — Est. total ' + fmt(bb.estimated_total_cost) + ' / Budget ' + fmt(bb.total_budget) +
    '</span>';

  const barsEl = document.getElementById('budgetBars');
  barsEl.innerHTML = '';
  (bb.categories || []).forEach(c => {
    const pct = Math.min(100, c.percent || 0);
    barsEl.innerHTML += `
      <div class="budget-row">
        <div class="budget-label">${c.category}</div>
        <div class="budget-track"><div class="budget-fill" style="width:${pct}%">${pct}%</div></div>
        <div class="budget-amount">${fmt(c.amount)}</div>
      </div>`;
  });
  document.getElementById('budgetReasoning').textContent = bb.reasoning || '';

  const altEl = document.getElementById('altGrid');
  altEl.innerHTML = '';
  (bb.alternatives || []).forEach(a => {
    altEl.innerHTML += `
      <div class="alt-card">
        <h4>${a.label}</h4>
        <p>${a.description}</p>
        <div class="alt-cost">Est. total: ${fmt(a.estimated_total_cost)}</div>
      </div>`;
  });

  const stayRow = document.getElementById('stayRow');
  stayRow.innerHTML = '';
  (data.stay_options || []).forEach((s, i) => {
    const url = hotelBookingUrl(s.name, payload.destination, s.platform);
    stayRow.innerHTML += `
      <div class="opt-card ${i === 0 ? 'best' : ''}">
        <div class="opt-rank">${i === 0 ? '★ Top Pick' : 'Option ' + (i + 1)}</div>
        <p class="opt-title">${s.name}</p>
        <p class="opt-sub">${s.area || ''} · ⭐ ${s.rating || '—'}</p>
        <div class="opt-price">${fmt(s.price_per_night)}<span style="font-size:0.7rem; color:#64748b;">/night</span></div>
        <div class="opt-meta">${s.nights || ''} nights · Total ${fmt(s.total_cost)}</div>
        <a class="opt-book" href="${url}" target="_blank">Book on ${s.platform || 'Search'}</a>
      </div>`;
  });

  const travelRow = document.getElementById('travelRow');
  travelRow.innerHTML = '';
  (data.travel_options || []).forEach((t, i) => {
    const isFlight = /flight/i.test(t.mode);
    const url = isFlight
      ? flightBookingUrl(payload.origin, payload.destination, payload.start_date, t.provider)
      : genericTravelUrl(t.mode, t.provider, payload.origin, payload.destination, t.platform);
    travelRow.innerHTML += `
      <div class="opt-card ${i === 0 ? 'best' : ''}">
        <div class="opt-rank">${i === 0 ? '★ Top Pick' : 'Option ' + (i + 1)}</div>
        <p class="opt-title">${t.provider || t.mode}</p>
        <p class="opt-sub">${t.mode} · ${t.departure_time || ''} → ${t.arrival_time || ''}</p>
        <div class="opt-price">${fmt(t.total_cost_for_group)}<span style="font-size:0.7rem; color:#64748b;"> total</span></div>
        <div class="opt-meta">${t.duration_hours ? t.duration_hours + 'h duration' : ''}</div>
        <a class="opt-book" href="${url}" target="_blank">Book on ${t.platform || 'Search'}</a>
      </div>`;
  });

  const itinEl = document.getElementById('itineraryDays');
  itinEl.innerHTML = '';
  (data.itinerary || []).forEach(day => {
    let stopsHtml = '';
    (day.stops || []).forEach(s => {
      stopsHtml += `
        <div class="stop-row">
          <div class="stop-time">${s.time_slot || ''}</div>
          <div class="stop-info">
            <p class="stop-place">${s.place || ''}</p>
            <p class="stop-desc">${s.description || ''}</p>
            ${s.transport_note ? `<p class="stop-transport">🚗 ${s.transport_note}</p>` : ''}
          </div>
        </div>`;
    });
    itinEl.innerHTML += `
      <div class="day-block">
        <div class="day-title">Day ${day.day}${day.date ? ' — ' + day.date : ''}</div>
        ${stopsHtml}
      </div>`;
  });
  if (!(data.itinerary || []).length) {
    itinEl.innerHTML = '<p style="color:#64748b; font-size:0.85rem;">No itinerary data returned.</p>';
  }

  document.getElementById('bookingNote').textContent = data.booking_note || '';
  document.getElementById('rawOutput').textContent = rawText;
  document.getElementById('results').style.display = 'block';
}

function toggleRaw() {
  const pre = document.getElementById('rawOutput');
  pre.style.display = pre.style.display === 'block' ? 'none' : 'block';
}
</script>
</body>
</html>
